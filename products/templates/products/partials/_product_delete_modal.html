<dialog
    id="delete-product-modal"
    class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl border-0 bg-white p-0 shadow-2xl backdrop:bg-black/50"
>

    <div class="p-6">

        <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-red-50">

            <i
                data-lucide="triangle-alert"
                class="h-7 w-7 text-red-600"
            ></i>

        </div>

        <h2 class="text-xl font-bold text-dark-green">
            Delete Product?
        </h2>

        <p class="mt-3 text-sm leading-6 text-text-muted">

            Are you sure you want to delete

            <strong
                id="delete-product-name"
                class="text-dark-green"
            ></strong>?

            This action cannot be undone.

        </p>

        <form
            id="delete-product-form"
            method="post"
            class="mt-7 flex justify-end gap-3"
        >
            {% csrf_token %}

            <button
                type="button"
                data-close-dialog="delete-product-modal"
                class="rounded-xl border border-border-light px-5 py-2.5 text-sm font-semibold text-dark-green hover:bg-page-bg"
            >
                Cancel
            </button>

            <button
                type="submit"
                class="rounded-xl bg-red-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-red-700"
            >
                Delete Product
            </button>

        </form>

    </div>

</dialog>
