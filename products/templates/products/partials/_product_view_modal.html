
<dialog
    id="view-product-modal"
    class="m-auto max-h-[90vh] w-[calc(100%-2rem)] max-w-lg overflow-y-auto rounded-2xl border-0 bg-white p-0 shadow-2xl backdrop:bg-black/50"
>

    <!-- HEADER -->
    <div class="flex items-center justify-between border-b border-border-light px-6 py-5">

        <h2 class="text-xl font-bold text-dark-green">
            Product Details
        </h2>

        <button
            type="button"
            data-close-dialog="view-product-modal"
            class="rounded-lg p-2 text-text-muted hover:bg-page-bg"
        >
            <i data-lucide="x" class="h-5 w-5"></i>
        </button>

    </div>

    <!-- BODY -->
    <div class="space-y-5 px-6 py-6">

        <!-- PRODUCT INFO -->
        <div class="flex items-center gap-4">

            <div class="flex h-20 w-20 shrink-0 items-center justify-center overflow-hidden rounded-xl bg-soft-green">

                <img
                    id="view-image"
                    alt="Product image"
                    class="hidden h-full w-full object-cover"
                >

                <i
                    id="view-image-placeholder"
                    data-lucide="package"
                    class="h-8 w-8 text-primary"
                ></i>

            </div>

            <div>

                <h3
                    id="view-name"
                    class="text-lg font-bold text-dark-green"
                ></h3>

                <p
                    id="view-sku"
                    class="mt-1 text-sm text-text-muted"
                ></p>

            </div>

        </div>

        <!-- COST INFORMATION -->
        <div class="grid grid-cols-2 gap-4 rounded-xl bg-page-bg p-4">

            <!-- PREVIOUS COST -->
            <div>

                <p class="text-xs text-text-muted">
                    Previous Cost
                </p>

                <p
                    id="view-previous-cost"
                    class="mt-1 font-semibold text-text-muted"
                >
                    —
                </p>

            </div>

            <!-- LATEST COST -->
            <div>

                <p class="text-xs text-text-muted">
                    Latest Cost
                </p>

                <p
                    id="view-cost"
                    class="mt-1 font-semibold text-dark-green"
                ></p>

            </div>

            <!-- WEIGHTED AVERAGE COST -->
            <div>

                <p class="text-xs text-text-muted">
                    Average Cost
                </p>

                <p
                    id="view-average-cost"
                    class="mt-1 font-semibold text-dark-green"
                >
                    —
                </p>

            </div>

            <!-- SELLING PRICE -->
            <div>

                <p class="text-xs text-text-muted">
                    Selling Price
                </p>

                <p
                    id="view-price"
                    class="mt-1 font-semibold text-dark-green"
                ></p>

            </div>

            <!-- AVAILABLE STOCK -->
            <div>

                <p class="text-xs text-text-muted">
                    Available Stock
                </p>

                <p
                    id="view-stock"
                    class="mt-1 font-semibold text-dark-green"
                ></p>

            </div>

            <!-- LOW STOCK ALERT -->
            <div>

                <p class="text-xs text-text-muted">
                    Low Stock Alert
                </p>

                <p
                    id="view-alert"
                    class="mt-1 font-semibold text-dark-green"
                ></p>

            </div>

        </div>

        <!-- CATEGORY -->
        <div>

            <p class="mb-1 text-xs font-semibold uppercase text-text-muted">
                Category
            </p>

            <p
                id="view-category"
                class="text-sm text-dark-green"
            ></p>

        </div>

        <!-- DESCRIPTION -->
        <div>

            <p class="mb-1 text-xs font-semibold uppercase text-text-muted">
                Description
            </p>

            <p
                id="view-description"
                class="whitespace-pre-wrap text-sm text-text-main"
            ></p>

        </div>

        <!-- CREATED DATE -->
        <div>

            <p class="mb-1 text-xs font-semibold uppercase text-text-muted">
                Created Date
            </p>

            <p
                id="view-created"
                class="text-sm text-text-main"
            ></p>

        </div>

    </div>

    <!-- FOOTER -->
    <div class="flex justify-end border-t border-border-light px-6 py-4">

        <button
            type="button"
            data-close-dialog="view-product-modal"
            class="rounded-xl bg-primary px-5 py-2.5 text-sm font-semibold text-white hover:bg-primary-dark"
        >
            Close
        </button>

    </div>

</dialog>
