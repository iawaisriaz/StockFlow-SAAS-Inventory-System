
<dialog
    id="view-supplier-modal"
    class="m-auto max-h-[90vh] w-[calc(100%-2rem)] max-w-lg overflow-y-auto rounded-2xl border-0 bg-white p-0 shadow-2xl backdrop:bg-black/50"
>
    <!-- HEADER -->
    <div class="flex items-center justify-between border-b border-border-light px-6 py-5">
        <h2 class="text-xl font-bold text-dark-green">
            Supplier Details
        </h2>

        <button
            type="button"
            data-close-dialog="view-supplier-modal"
            class="rounded-lg p-2 text-text-muted hover:bg-page-bg"
            aria-label="Close"
        >
            <i data-lucide="x" class="h-5 w-5"></i>
        </button>
    </div>

    <!-- DETAILS -->
    <div class="space-y-5 px-6 py-6">
        <div class="flex items-center gap-4">
            <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-xl bg-soft-green">
                <i data-lucide="truck" class="h-8 w-8 text-primary"></i>
            </div>

            <div class="min-w-0">
                <h3
                    id="view-supplier-name"
                    class="break-words text-lg font-bold text-dark-green"
                ></h3>

                <span
                    id="view-supplier-status"
                    class="mt-2 inline-flex rounded-full px-3 py-1 text-xs font-semibold"
                ></span>
            </div>
        </div>

        <!-- CONTACT -->
        <div class="grid grid-cols-1 gap-4 rounded-xl bg-page-bg p-4 sm:grid-cols-2">
            <div>
                <p class="text-xs text-text-muted">Contact Person</p>
                <p id="view-supplier-person" class="mt-1 break-words text-sm font-semibold text-dark-green"></p>
            </div>

            <div>
                <p class="text-xs text-text-muted">Phone Number</p>
                <p id="view-supplier-phone" class="mt-1 break-words text-sm font-semibold text-dark-green"></p>
            </div>

            <div class="sm:col-span-2">
                <p class="text-xs text-text-muted">Email Address</p>
                <p id="view-supplier-email" class="mt-1 break-all text-sm font-semibold text-dark-green"></p>
            </div>
        </div>

        <!-- ADDRESS -->
        <div>
            <p class="mb-1 text-xs font-semibold uppercase text-text-muted">
                Address
            </p>
            <p id="view-supplier-address" class="whitespace-pre-wrap text-sm text-text-main"></p>
        </div>

        <!-- LOCATION -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <p class="mb-1 text-xs font-semibold uppercase text-text-muted">
                    City
                </p>
                <p id="view-supplier-city" class="text-sm text-text-main"></p>
            </div>

            <div>
                <p class="mb-1 text-xs font-semibold uppercase text-text-muted">
                    Country
                </p>
                <p id="view-supplier-country" class="text-sm text-text-main"></p>
            </div>
        </div>

        <!-- LINKED PRODUCTS -->
        <div>
            <div class="mb-3 flex items-center justify-between">
                <p class="text-xs font-semibold uppercase text-text-muted">
                    Linked Products
                </p>

                <span
                    id="view-supplier-products-count"
                    class="rounded-full bg-soft-green px-2.5 py-1 text-xs font-semibold text-primary"
                >
                    0 Products
                </span>
            </div>

            <div
                id="view-supplier-products"
                class="max-h-52 space-y-2 overflow-y-auto"
            >
                <p class="text-sm text-text-muted">
                    No linked products.
                </p>
            </div>
        </div>

        <!-- NOTES -->
        <div>
            <p class="mb-1 text-xs font-semibold uppercase text-text-muted">
                Notes
            </p>
            <p id="view-supplier-notes" class="whitespace-pre-wrap text-sm text-text-main"></p>
        </div>

        <!-- CREATED DATE -->
        <div>
            <p class="mb-1 text-xs font-semibold uppercase text-text-muted">
                Created Date
            </p>
            <p id="view-supplier-created" class="text-sm text-text-main"></p>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="flex justify-end border-t border-border-light px-6 py-4">
        <button
            type="button"
            data-close-dialog="view-supplier-modal"
            class="rounded-xl bg-primary px-5 py-2.5 text-sm font-semibold text-white hover:bg-primary-dark"
        >
            Close
        </button>
    </div>
</dialog>
