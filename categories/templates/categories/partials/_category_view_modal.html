<!-- VIEW CATEGORY MODAL -->
<dialog
    id="view-category-modal"
    class="m-auto w-[calc(100%-2rem)] max-w-lg rounded-2xl border-0 bg-white p-0 shadow-2xl backdrop:bg-black/50"
>

    <!-- HEADER -->
    <div class="flex items-center justify-between border-b border-border-light px-6 py-5">

        <h2 class="text-xl font-bold text-dark-green">
            Category Details
        </h2>

        <button
            type="button"
            data-close-dialog="view-category-modal"
            class="rounded-lg p-2 text-text-muted transition hover:bg-page-bg"
        >

            <i
                data-lucide="x"
                class="h-5 w-5"
            ></i>

        </button>

    </div>


    <!-- CATEGORY DETAILS -->
    <div class="space-y-6 px-6 py-6">

        <!-- CATEGORY NAME -->
        <div>

            <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-text-muted">
                Category Name
            </p>

            <p
                id="view-category-name"
                class="text-base font-semibold text-dark-green"
            ></p>

        </div>


        <!-- DESCRIPTION -->
        <div>

            <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-text-muted">
                Description
            </p>

            <p
                id="view-category-description"
                class="whitespace-pre-wrap text-sm leading-6 text-text-main"
            ></p>

        </div>


        <!-- CREATED DATE -->
        <div>

            <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-text-muted">
                Created Date
            </p>

            <p
                id="view-category-created"
                class="text-sm text-text-main"
            ></p>

        </div>

    </div>


    <!-- MODAL FOOTER -->
    <div class="flex justify-end border-t border-border-light px-6 py-4">

        <button
            type="button"
            data-close-dialog="view-category-modal"
            class="rounded-xl bg-primary px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-dark"
        >
            Close
        </button>

    </div>

</dialog>
