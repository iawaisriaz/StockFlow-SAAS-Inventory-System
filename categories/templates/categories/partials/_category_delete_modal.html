<!-- DELETE CATEGORY MODAL -->
<dialog
    id="delete-category-modal"
    class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl border-0 bg-white p-0 shadow-2xl backdrop:bg-black/50"
>

    <div class="px-6 py-6">

        <!-- WARNING ICON -->
        <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-red-50">

            <i
                data-lucide="triangle-alert"
                class="h-7 w-7 text-red-600"
            ></i>

        </div>


        <!-- TITLE -->
        <h2 class="text-xl font-bold text-dark-green">
            Delete Category?
        </h2>


        <!-- WARNING MESSAGE -->
        <p class="mt-3 text-sm leading-6 text-text-muted">

            Are you sure you want to delete

            <strong
                id="delete-category-name"
                class="text-dark-green"
            ></strong>?

            This action cannot be undone.

        </p>


        <!-- DELETE FORM -->
        <form
            id="delete-category-form"
            method="post"
            class="mt-7 flex justify-end gap-3"
        >

            {% csrf_token %}

            <!-- CANCEL -->
            <button
                type="button"
                data-close-dialog="delete-category-modal"
                class="rounded-xl border border-border-light px-5 py-2.5 text-sm font-semibold text-dark-green transition hover:bg-page-bg"
            >
                Cancel
            </button>


            <!-- CONFIRM DELETE -->
            <button
                type="submit"
                class="rounded-xl bg-red-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-red-700"
            >
                Delete Category
            </button>

        </form>

    </div>

</dialog>
