<dialog
    id="delete-purchase-modal"
    class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl border-0 bg-white p-0 shadow-2xl backdrop:bg-black/50"
>

    <div class="p-6">

        <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-red-100">

            <i
                data-lucide="trash-2"
                class="h-6 w-6 text-red-600"
            ></i>

        </div>

        <h2 class="text-xl font-bold text-dark-green">
            Delete Purchase?
        </h2>

        <p class="mt-2 text-sm leading-6 text-text-muted">

            Are you sure you want to delete

            <strong
                id="delete-purchase-name"
                class="text-dark-green"
            ></strong>?

            This action cannot be undone.

        </p>

        <form
            id="delete-purchase-form"
            method="post"
            class="mt-6 flex justify-end gap-3"
        >

            {% csrf_token %}

            <button
                type="button"
                data-close-dialog="delete-purchase-modal"
                class="rounded-xl border border-border-light px-5 py-2.5 text-sm font-semibold text-dark-green"
            >
                Cancel
            </button>

            <button
                type="submit"
                class="rounded-xl bg-red-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-red-700"
            >
                Delete Purchase
            </button>

        </form>

    </div>

</dialog>
