
<dialog
    id="purchase-confirm-dialog"
    class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl border-0 bg-white p-0 shadow-2xl backdrop:bg-black/60"
>
    <div class="p-6">
        <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-soft-green text-primary">
            <i data-lucide="alert-circle" class="h-6 w-6"></i>
        </div>

        <h2
            id="purchase-confirm-title"
            class="text-xl font-bold text-dark-green"
        ></h2>

        <p
            id="purchase-confirm-message"
            class="mt-3 text-sm leading-6 text-text-muted"
        ></p>

        <form
            id="purchase-confirm-form"
            method="post"
            class="mt-6 flex justify-end gap-3"
        >
            {% csrf_token %}

            <button
                type="button"
                data-close-dialog="purchase-confirm-dialog"
                class="rounded-xl border border-border-light px-5 py-3 text-sm font-semibold text-dark-green"
            >
                Back
            </button>

            <button
                type="submit"
                id="purchase-confirm-submit"
                class="rounded-xl bg-primary px-5 py-3 text-sm font-semibold text-white hover:bg-primary-dark"
            >
                Confirm
            </button>
        </form>
    </div>
</dialog>
